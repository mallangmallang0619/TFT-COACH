<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">TFT Coach Control Center</title>
  <desc id="description">The desktop Control Center showing detection, game, collection status, and support actions.</desc>
  <rect width="1200" height="675" fill="#030303"/>
  <rect width="1200" height="66" fill="#0d0e13"/>
  <path d="M0 65.5H1200" stroke="#282a35"/>
  <text x="28" y="29" fill="#f5f5f7" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="3">TFT COACH</text>
  <text x="28" y="48" fill="#8d90a6" font-family="Arial, sans-serif" font-size="11">Control Center</text>
  <g font-family="Arial, sans-serif" font-size="13">
    <rect x="972" y="15" width="88" height="36" rx="8" fill="#171922" stroke="#292c39"/>
    <text x="994" y="38" fill="#b9bbca">Minimize</text>
    <rect x="1070" y="15" width="116" height="36" rx="8" fill="#171922" stroke="#292c39"/>
    <text x="1088" y="38" fill="#b9bbca">Quit TFT Coach</text>
  </g>
  <text x="105" y="122" fill="#f7f7fa" font-family="Arial, sans-serif" font-size="28" font-weight="700">Your coaching setup</text>
  <text x="105" y="154" fill="#999caf" font-family="Arial, sans-serif" font-size="14">Manage the detector, overlay, diagnostics, and files here. Leave this window minimized while playing.</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(105 190)">
      <rect width="310" height="126" rx="12" fill="#171922" stroke="#303342"/>
      <text x="18" y="28" fill="#85899e" font-size="10" font-weight="700" letter-spacing="2">DETECTION ENGINE</text>
      <circle cx="22" cy="54" r="5" fill="#43d89c"/>
      <text x="35" y="60" fill="#f3f3f6" font-size="17" font-weight="700">Ready</text>
      <text x="18" y="88" fill="#8f93a7" font-size="12">Backend connected on a local port</text>
    </g>
    <g transform="translate(445 190)">
      <rect width="310" height="126" rx="12" fill="#171922" stroke="#303342"/>
      <text x="18" y="28" fill="#85899e" font-size="10" font-weight="700" letter-spacing="2">GAME</text>
      <circle cx="22" cy="54" r="5" fill="#f5bd4f"/>
      <text x="35" y="60" fill="#f3f3f6" font-size="17" font-weight="700">Waiting for TFT.exe</text>
      <text x="18" y="88" fill="#8f93a7" font-size="12">Detection starts when the game window appears</text>
    </g>
    <g transform="translate(785 190)">
      <rect width="310" height="126" rx="12" fill="#171922" stroke="#303342"/>
      <text x="18" y="28" fill="#85899e" font-size="10" font-weight="700" letter-spacing="2">CAPTURE &amp; COLLECTION</text>
      <circle cx="22" cy="54" r="5" fill="#969bad"/>
      <text x="35" y="60" fill="#f3f3f6" font-size="17" font-weight="700">Waiting</text>
      <text x="18" y="88" fill="#8f93a7" font-size="12">Live status appears after TFT is detected</text>
    </g>
  </g>
  <text x="105" y="365" fill="#f7f7fa" font-family="Arial, sans-serif" font-size="17" font-weight="700">Quick actions</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(105 388)">
      <rect width="480" height="65" rx="10" fill="#171922" stroke="#303342"/>
      <text x="16" y="27" fill="#f0f0f4" font-size="14" font-weight="700">Hide overlay</text>
      <text x="16" y="47" fill="#8f93a7" font-size="11">Toggle the in-game coaching window</text>
      <text x="455" y="39" fill="#777b90" font-size="22">›</text>
    </g>
    <g transform="translate(615 388)">
      <rect width="480" height="65" rx="10" fill="#171922" stroke="#303342"/>
      <text x="16" y="27" fill="#f0f0f4" font-size="14" font-weight="700">Restart detection engine</text>
      <text x="16" y="47" fill="#8f93a7" font-size="11">Use this if capture or live data stops updating</text>
      <text x="455" y="39" fill="#777b90" font-size="22">›</text>
    </g>
    <g transform="translate(105 468)">
      <rect width="480" height="65" rx="10" fill="#171922" stroke="#303342"/>
      <text x="16" y="27" fill="#f0f0f4" font-size="14" font-weight="700">Run diagnostic capture</text>
      <text x="16" y="47" fill="#8f93a7" font-size="11">Capture and annotate the current TFT window</text>
      <text x="455" y="39" fill="#777b90" font-size="22">›</text>
    </g>
    <g transform="translate(615 468)">
      <rect width="480" height="65" rx="10" fill="#171922" stroke="#303342"/>
      <text x="16" y="27" fill="#f0f0f4" font-size="14" font-weight="700">Export support ZIP</text>
      <text x="16" y="47" fill="#8f93a7" font-size="11">Package diagnostics, logs, and model metadata</text>
      <text x="455" y="39" fill="#777b90" font-size="22">›</text>
    </g>
    <g transform="translate(105 548)">
      <rect width="480" height="65" rx="10" fill="#171922" stroke="#303342"/>
      <text x="16" y="27" fill="#f0f0f4" font-size="14" font-weight="700">Open diagnostics folder</text>
      <text x="16" y="47" fill="#8f93a7" font-size="11">Review screenshots and annotated captures</text>
      <text x="455" y="39" fill="#777b90" font-size="22">›</text>
    </g>
    <g transform="translate(615 548)">
      <rect width="480" height="65" rx="10" fill="#171922" stroke="#303342"/>
      <text x="16" y="27" fill="#f0f0f4" font-size="14" font-weight="700">Open logs folder</text>
      <text x="16" y="47" fill="#8f93a7" font-size="11">Inspect backend startup and detection messages</text>
      <text x="455" y="39" fill="#777b90" font-size="22">›</text>
    </g>
  </g>
</svg>
